services:
  social-rating-app-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - 3001:3001
    environment:
      env_file: .env.production
    volumes:
      - ./src:/app/src
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0.7
    environment:
      MONGO_INITDB_ROOT_USERNAME: social-rating
      MONGO_INITDB_ROOT_PASSWORD: asDJHCj387811js69hu3827HWQUhkj2
    ports:
      - 27017:27017
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3